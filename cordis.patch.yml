# dsh-whale bundle patch.
#
# The row id is stable: users override this row by id from
# $DSH_HOME/profiles/<profile>/cordis.patch.yml or $DSH_HOME/cordis.patch.yml.
# Remember that a patch replaces the whole `config` object, not a deep merge.
- insert:
    - id: whale
      name: dsh-whale-backup
      config:
        # Everything below is optional and mirrors lib/core/config.js.
        # localDir: ~/.dsh/backups
        # compression: zstd            # zstd | gzip | none
        # profiles: all               # all profiles (desktop/web/headless)
        # workspace: auto              # auto | all | /absolute/path
        # includeCredentials: false
        # includePluginData: true
        # includeWorkspaceFiles: false
        # includePluginCode: true
        # includeStorages: true
        # webdav:
        #   url: https://dav.example.com/remote.php/dav/files/me/
        #   remoteDir: easy-backup
        #   username: me
        #   password: direct password (stored in config; optional)
        #   passwordEnv: DSH_BACKUP_WEBDAV_PASSWORD
